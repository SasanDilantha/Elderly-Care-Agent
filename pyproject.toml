[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "elderly-care-agent"
version = "0.1.0"
description = "Hybrid computer-vision and local VLM elderly-care monitoring system."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [
  { name = "Sasan Dilantha" },
]
dependencies = [
  "cvzone==1.6.1",
  "mediapipe==0.10.21",
  "numpy>=1.26,<2",
  "ollama>=0.6,<1",
  "opencv-contrib-python==4.11.0.86",
  "opencv-python==4.11.0.86",
  "ultralytics>=8.4,<9",
  "lap>=0.5.12",
  "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
  "coverage[toml]>=7.10,<8",
  "ruff>=0.13,<1",
]

[project.scripts]
elderly-care-agent = "elderly_care_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/elderly_care_agent"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.coverage.run]
branch = true
source = ["elderly_care_agent"]

[tool.coverage.report]
fail_under = 80
show_missing = true
