[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "elderly-care-agent"
version = "0.1.0"
description = "Hybrid computer-vision and local VLM elderly-care monitoring system."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { file = "LICENSE" }
authors = [
  { name = "Elderly Care Agent Team" },
]
dependencies = []

[project.scripts]
elderly-care-agent = "elderly_care_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/elderly_care_agent"]

[tool.uv]
package = true

